name: Feature request
description: Propose an addition or change to the API.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        [
          '@nizam-os/ban-core',
          '@nizam-os/hono-ban',
          '@nizam-os/catalog-core',
          '@nizam-os/pg-catalog',
          '@nizam-os/intl-core',
          '@nizam-os/paraglide-intl',
          '@nizam-os/jsonapi-core',
          '@nizam-os/hono-jsonapi',
          '@nizam-os/jsonapi-client',
          '@nizam-os/tanstack-query-jsonapi',
          '@nizam-os/keyset-core',
          '@nizam-os/kysely-keyset',
          '@nizam-os/drizzle-keyset',
          '@nizam-os/resource-core',
          '@nizam-os/kysely-resource',
          '@nizam-os/hono-resource',
          '@nizam-os/resource-ui',
          '@nizam-os/tanstack-form-resource',
          a new package,
          the repository or its docs,
        ]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what does the workaround look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show the code you would like to write.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

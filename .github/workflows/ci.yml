name: CI

# A push to main runs this workflow from release.yml, which packs nothing
# from a commit that fails it. `workflow_dispatch` runs it on main by hand.
on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions: {}

# A newer commit cancels the run of an older one on the same pull request or
# merge group. Called from release.yml, `github.workflow` and
# `github.event_name` are the caller's, so a release's run has a group of its
# own and is never cancelled.
# @ref https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  FORCE_COLOR: 1

jobs:
  quality:
    name: Format, lint, types, deps, floors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The type-aware lint of e2e/* resolves the packages into their dist/
      # and reads the messages e2e/resource's build compiles with Paraglide,
      # so build first. The packages resolve each other from source (the
      # `source` export condition) and need no build.
      - run: pnpm run build
      - run: pnpm run check:format
      - run: pnpm run check:lint
      - run: pnpm run check:types
      - run: pnpm run check:deps
      # Every peer range's floor has its job below (root ADR 0008). The
      # advisory half needs the network and runs in peer-floors.yml.
      - run: pnpm run check:floors

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      # Every package's project in one run; a binding resolves its core from
      # source, so no build is needed here.
      - run: pnpm run test:coverage
      - if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  test-kysely-floor:
    name: Test (Kysely 0.28.17 and 0.29.0, the peer range floors)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/kysely-keyset declares `kysely >= 0.28.17`, the first release
      # past Kysely's published SQL injection advisories (keyset ADR 0018); its
      # unit tests compile SQL through that floor. The e2e suite needs 0.29 for
      # the built-in PGlite dialect.
      - run: pnpm --filter @nizam-os/kysely-keyset add --save-dev kysely@0.28.17
      - run: pnpm --filter @nizam-os/kysely-keyset run typecheck
      - run: pnpm --filter @nizam-os/kysely-keyset run test
      # @nizam-os/kysely-resource declares `kysely >= 0.29.0`, the first
      # release with the PGlite dialect its tests run every query through. It
      # renders with kysely-keyset, so both go on 0.29.0: with two copies
      # their expression builders' types disagree.
      - run: pnpm --filter @nizam-os/kysely-keyset --filter @nizam-os/kysely-resource add --save-dev kysely@0.29.0
      - run: pnpm --filter @nizam-os/kysely-resource run typecheck
      - run: pnpm --filter @nizam-os/kysely-resource run test

  test-drizzle-floor:
    name: Test (drizzle-orm 0.45.2, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/drizzle-keyset declares `drizzle-orm >=0.45.2 <1.0.0`. The
      # API it uses is older; 0.45.2 is the floor because it is the first
      # release that doubles a quote inside an identifier (CVE-2026-39356,
      # pinned by render/target.test.ts). Its typecheck and tests run on it.
      - run: pnpm --filter @nizam-os/drizzle-keyset add --save-dev drizzle-orm@0.45.2
      - run: pnpm --filter @nizam-os/drizzle-keyset run typecheck
      - run: pnpm --filter @nizam-os/drizzle-keyset run test

  test-zod-floor:
    name: Test (Zod 4.5, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/resource-core declares `zod ^4.5.0`, the first release whose
      # `.max()` counts code points as PostgreSQL's char_length does
      # (length.test.ts pins it); its unit tests run on that version.
      - run: pnpm --filter @nizam-os/resource-core add --save-dev zod@4.5.0
      - run: pnpm --filter @nizam-os/resource-core run typecheck
      - run: pnpm --filter @nizam-os/resource-core run test

  test-tanstack-query-floor:
    name: Test (TanStack Query 5.89, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/tanstack-query-jsonapi declares `@tanstack/query-core
      # ^5.89.0`, the first release whose mutation callbacks receive the
      # `QueryClient` (`context.client`, jsonapi SPEC 16.7); its typecheck
      # and tests run on it.
      - run: pnpm --filter @nizam-os/tanstack-query-jsonapi add --save-dev @tanstack/query-core@5.89.0
      - run: pnpm --filter @nizam-os/tanstack-query-jsonapi run typecheck
      - run: pnpm --filter @nizam-os/tanstack-query-jsonapi run test

  test-tanstack-form-floor:
    name: Test (TanStack Form 1.17, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/tanstack-form-resource declares `@tanstack/form-core
      # ^1.17.0`, the first release with `revalidateLogic` (resource SPEC
      # 20.9); its typecheck and tests run on it.
      - run: pnpm --filter @nizam-os/tanstack-form-resource add --save-dev @tanstack/form-core@1.17.0
      - run: pnpm --filter @nizam-os/tanstack-form-resource run typecheck
      - run: pnpm --filter @nizam-os/tanstack-form-resource run test

  test-hono-floor:
    name: Test (Hono 4.13.7, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/hono-ban, @nizam-os/hono-jsonapi, and @nizam-os/hono-resource
      # declare `hono >=4.13.7`, the first release no published Hono advisory
      # affects; hono-resource also needs 4.13.0's `hono/utils/url` export of
      # `tryDecodeURIComponent` (resource SPEC 19.8). The three go on one
      # hono, as an application has one: two copies make their `Context`
      # types disagree.
      - run: pnpm --filter @nizam-os/hono-ban --filter @nizam-os/hono-jsonapi --filter @nizam-os/hono-resource add --save-dev hono@4.13.7
      - run: pnpm --filter @nizam-os/hono-ban --filter @nizam-os/hono-jsonapi --filter @nizam-os/hono-resource run typecheck
      - run: pnpm --filter @nizam-os/hono-ban --filter @nizam-os/hono-jsonapi --filter @nizam-os/hono-resource run test

  test-pglite-floor:
    name: Test (PGlite 0.5.0, the peer range floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/pg-catalog declares `@electric-sql/pglite ^0.5.0`, which its
      # default target imports on demand; its typecheck and tests extract
      # catalogs through 0.5.0. The tests that need a server skip without
      # CATALOG_PG_URL, as in the test job.
      - run: pnpm --filter @nizam-os/pg-catalog add --save-dev @electric-sql/pglite@0.5.0
      - run: pnpm --filter @nizam-os/pg-catalog run typecheck
      - run: pnpm --filter @nizam-os/pg-catalog run test

  test-paraglide-floor:
    name: Test (Paraglide 2.11, the peer range floor, and 2.26, the last on SDK 3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # @nizam-os/paraglide-intl declares `@inlang/paraglide-js >=2.11.0
      # <3.0.0`: 2.11.0 is the first release that compiles markup. It loads
      # projects with the inlang SDK Paraglide depends on (root ADR 0009), so
      # its typecheck and tests run on 2.11.0, which depends on SDK 2, and on
      # 2.26.0, the last release on SDK 3; the test job runs SDK 4.
      - run: pnpm --filter @nizam-os/paraglide-intl add --save-dev @inlang/paraglide-js@2.11.0
      - run: pnpm --filter @nizam-os/paraglide-intl run typecheck
      - run: pnpm --filter @nizam-os/paraglide-intl run test
      - run: pnpm --filter @nizam-os/paraglide-intl add --save-dev @inlang/paraglide-js@2.26.0
      - run: pnpm --filter @nizam-os/paraglide-intl run typecheck
      - run: pnpm --filter @nizam-os/paraglide-intl run test

  build:
    name: Build and package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:pkg
      # The build rewrites each package's exports maps; a diff means the
      # committed maps drifted from the tsdown entry maps.
      - run: git diff --exit-code -- packages/*/package.json
      # pnpm pack applies publishConfig (the dist-only exports map) and
      # rewrites workspace: ranges, as a publish would.
      - run: pnpm -r --filter "./packages/**" exec pnpm pack --pack-destination /tmp/pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: /tmp/pack/*.tgz
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.family }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        family: [ban, catalog, intl, jsonapi, keyset, resource]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      # Each e2e workspace consumes its family's built packages through
      # `workspace:*`, so it type-checks and runs against dist/ exactly as an
      # install would. The keyset, catalog, and resource suites run on PGlite
      # here; PostgreSQL servers are the jobs below.
      - run: pnpm run build
      - run: pnpm --filter @nizam-os/${{ matrix.family }}-e2e run typecheck
      - run: pnpm --filter @nizam-os/${{ matrix.family }}-e2e run test

  e2e-postgres:
    name: E2E (keyset, PostgreSQL ${{ matrix.postgres }} server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Every e2e file, with a real server: postgres.e2e.test.ts runs the
      # invariants there (NULLS LAST ordering, tsquery search, microsecond
      # casts on the planner and executor production uses), and the feature
      # files that take their databases from databases() add the server to
      # PGlite. Without the variable those files run on PGlite alone.
      - run: pnpm --filter @nizam-os/keyset-e2e exec vitest run
        env:
          KEYSET_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e-catalog-postgres:
    name: E2E (catalog, PostgreSQL ${{ matrix.postgres }} server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The package's own server tests (the throwaway database target,
      # catalogs read from the server equal to PGlite's, the Kysely type
      # table held against node-postgres, and drift as a read-only role),
      # then the e2e suite, which extracts the contacts application on this
      # major and compares the bytes with the reviewed files PGlite produced,
      # reads every table back through Kysely with the generated types, and
      # finds no drift between this server and the committed catalog.
      - run: pnpm --filter @nizam-os/pg-catalog run test
      - run: pnpm --filter @nizam-os/catalog-e2e run test

  e2e-resource-postgres:
    name: E2E (resource, PostgreSQL ${{ matrix.postgres }} server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Every e2e file, with a real server: the oracle (resource SPEC 15.3)
      # writes each boundary fixture into its column on this major as well
      # as PGlite, in a throwaway UTF8 database, and holds PostgreSQL's
      # verdict against the schema's. Without the variable it runs on PGlite
      # alone.
      - run: pnpm --filter @nizam-os/resource-e2e exec vitest run
        env:
          RESOURCE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  runtimes:
    name: Smoke (Bun, Deno, workerd)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # One module per family importing its packages, driven in-process by
      # each runtime (e2e/*/smoke/); the intl family first compiles its
      # fixture messages on that runtime, on Node for workerd. workerd runs
      # through Miniflare on Node.
      - run: pnpm -r --workspace-concurrency=1 --filter "./e2e/**" run smoke:bun
      - run: pnpm -r --workspace-concurrency=1 --filter "./e2e/**" run smoke:deno
      - run: pnpm -r --workspace-concurrency=1 --filter "./e2e/**" run smoke:workerd

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Fails when a package's src/ changed without a changeset. Docs-only
      # and e2e-only PRs pass.
      - run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- packages/*/src; then
            echo "No package source changes; changeset not required."
          else
            pnpm changeset status --since=origin/${{ github.base_ref }}
          fi

  # The one status check the `protect main` ruleset requires
  # (docs/adr/0004-protect-main-with-one-aggregate-check.md). It needs every
  # job above and fails when any of them failed or was cancelled; a job skipped
  # by its own condition (the changeset check outside pull requests) counts as
  # passed. `always()` keeps this job from being skipped when a dependency
  # fails, because a skipped required check would not block the merge. A new
  # job goes into `needs` in the same change.
  # @ref https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  # @ref https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
  passed:
    name: CI passed
    if: always()
    needs:
      - quality
      - test
      - test-kysely-floor
      - test-drizzle-floor
      - test-zod-floor
      - test-tanstack-query-floor
      - test-tanstack-form-floor
      - test-hono-floor
      - test-pglite-floor
      - test-paraglide-floor
      - build
      - e2e
      - e2e-postgres
      - e2e-catalog-postgres
      - e2e-resource-postgres
      - runtimes
      - changeset
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

# pnpm settings live here, not in .npmrc (pnpm 10+ reads only auth and
# registry settings from .npmrc).
# @ref https://pnpm.io/settings
# @ref https://pnpm.io/supply-chain-security
# @ref https://pnpm.io/workspaces

# `packages/*` are the published packages, one directory per package, named
# after the package without its scope (`packages/ban-core` is
# `@nizam-os/ban-core`). A binding depends on its core through `workspace:^`.
# `e2e/*` are private consumer packages, one per family, that install the
# built packages through `workspace:*`, so their imports resolve through the
# published `exports` maps into `dist/`.
packages:
  - packages/*
  - e2e/*

# The version of every dependency that two or more workspace packages declare,
# referenced from their package.json as `"name": "catalog:"`. `pnpm publish`
# replaces the reference with the version below. Peer ranges are a package's
# published contract and stay in its own package.json; a dependency only one
# package uses stays pinned there (docs/adr/0005-share-dependency-versions-through-a-pnpm-catalog.md).
# @ref https://pnpm.io/catalogs
catalog:
  ajv: 8.20.0
  ajv-formats: 3.0.1
  '@angular/common': 22.2.2
  '@angular/core': 22.2.2
  drizzle-orm: 0.45.4
  '@electric-sql/pglite': 0.5.8
  '@electric-sql/pglite-socket': 0.2.11
  hono: 4.13.13
  '@hono/node-server': 2.1.3
  '@hono/standard-validator': 0.4.0
  '@hono/valibot-validator': 0.6.1
  '@hono/zod-openapi': 1.6.3
  '@hono/zod-validator': 0.9.1
  '@inlang/paraglide-js': 2.27.0
  '@inlang/plugin-message-format': 4.5.1
  jsdom: 30.1.2
  kysely: 0.29.6
  miniflare: 4.20260730.0
  '@opentelemetry/api': 1.9.1
  # A runtime dependency of @nizam-os/pg-catalog, so a caret range: `pnpm publish`
  # writes the entry as it stands, and applications share one copy of pg.
  pg: ^8.23.1
  postgres: 3.4.9
  react: 19.3.0
  rxjs: 7.8.2
  solid-js: 1.9.17
  svelte: 5.57.2
  '@tanstack/form-core': 1.33.5
  '@tanstack/query-core': 5.104.1
  '@tanstack/react-query': 5.104.1
  '@tanstack/vue-query': 5.104.1
  tsdown: 0.23.0
  '@types/node': 26.6.4
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: 5.0.3
  vue: 3.5.43
  zod: 4.6.5

# Do not install versions published less than a day ago; most compromised
# releases are pulled within hours.
minimumReleaseAge: 1440

# Refuse a version whose publisher verification is weaker than the previous
# one (for example a release without provenance after releases with it).
trustPolicy: no-downgrade

# Transitive dependencies may not come from git or tarball URLs.
blockExoticSubdeps: true

# Dependencies allowed to run install scripts. lefthook downloads its binary
# in postinstall; workerd (pulled in by miniflare for the e2e smoke tests)
# selects its platform binary in postinstall. vue-demi (pulled in by Vue
# Query for the e2e suites' Vue checks and screen) is denied: its
# postinstall only switches its files to the installed Vue's major, and the
# files it ships are Vue 3's. Everything else is blocked (pnpm default), and
# an install fails on a build nobody has ruled on (`strictDepBuilds`).
# @ref https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  lefthook: true
  vue-demi: false
  workerd: true

# @nizam-os/hono-jsonapi declares `@nizam-os/hono-ban >= 2.0.0` (its API is the
# 2.0 one), and in this workspace it resolves to the working copy, which stays
# at 1.3.0 until the pending major changeset is versioned. Remove this rule in
# the "Version Packages" PR that bumps @nizam-os/hono-ban to 2.0.0.
# @ref https://pnpm.io/settings/peer-dependencies#peerdependencyrulesallowedversions
peerDependencyRules:
  allowedVersions:
    '@nizam-os/hono-jsonapi>@nizam-os/hono-ban': '1'

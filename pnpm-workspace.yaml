# The workspace file of the kit's public repository (nizam-os/kit-ts). The kit is developed as
# one tree of the Nizam suite's pnpm workspace, which keeps no workspace file inside the tree, so
# the export to the public repository writes this one: these settings, followed by the `catalog:`
# rows of the suite's catalog that the packages reference. It is edited where the kit is
# developed, never in the public repository, which takes no commits of its own.
# @ref https://pnpm.io/workspaces
# @ref https://pnpm.io/settings

# `packages/*` are the published packages, one directory per package, named after the package
# without its scope (`packages/ban-core` is `@nizam-os/ban-core`). A binding depends on its core
# through `workspace:^`. `e2e/*` are private consumer packages, one per family, that install the
# built packages through `workspace:*`, so their imports resolve through the published `exports`
# maps into `dist/`.
packages:
  - packages/*
  - e2e/*

# Do not install versions published less than a day ago; most compromised releases are pulled
# within hours.
minimumReleaseAge: 1440

# Refuse a version whose publisher verification is weaker than an earlier release's: a maintainer
# who published with provenance and then publishes without it looks like a taken-over account. A
# downgrade older than 90 days (in minutes) that is still on the registry is the legitimate lapse
# it almost always is; a younger one fails the install until someone verifies it and lists it under
# `trustPolicyExclude` as one exact version, pruned automatically once the lockfile moves on.
# @ref https://pnpm.io/settings/dependency-resolution#trustpolicy
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
trustPolicyExcludePrune: true

# Transitive dependencies may not come from git or tarball URLs.
blockExoticSubdeps: true

# Every dependency with an install script needs a ruling below; an install fails on one nobody has
# ruled on. Allowed: lefthook downloads its binary in postinstall; workerd (miniflare, the e2e
# smoke tests) selects its platform binary. Denied, because the script adds nothing we use:
# vue-demi (Vue Query, the e2e suites' Vue checks) only switches its files to the installed Vue's
# major, and it ships Vue 3's; esbuild only checks the binary its platform package installed.
# @ref https://pnpm.io/settings/build#allowbuilds
strictDepBuilds: true
allowBuilds:
  esbuild: false
  lefthook: true
  vue-demi: false
  workerd: true

# One Version: the rows of the suite catalog these packages reference, written by the export.
# @ref https://pnpm.io/catalogs
catalog:
  '@angular/common': 22.2.2
  '@angular/core': 22.2.2
